name: CI

on: [push, pull_request]

jobs:
  build:
    name: JDK ${{ matrix.java_version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java_version: [21]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            8
            11
            ${{ matrix.java_version }}
          cache: 'gradle'
      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@v6
      - name: Configure Gradle
        # Gradle configuration install deps 
        run: ./gradlew help
      - name: Build Project
        run: ./gradlew spotlessCheck build --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64
      - name : Testing 
        run: ./gradlew test --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64
      - name: Final Checks
        run: ./gradlew check --stacktrace -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64
      - name: Upload Snapshot
        if: success() && github.repository == 'uber/motif' && github.ref == 'refs/heads/main' && github.event_name == 'push' && matrix.java_version == '21'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USER_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_USER_TOKEN_PASSWORD }}
        run: |
          if ! grep -q '^VERSION_NAME=.*-SNAPSHOT$' gradle.properties; then
            echo 'Skipping snapshot upload: VERSION_NAME is not a snapshot.'
            exit 0
          fi
          ./gradlew publishToMavenCentral --no-daemon --no-parallel \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64
